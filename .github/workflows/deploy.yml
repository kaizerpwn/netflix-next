name: CI/CD Pipeline for Next.js

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Docker Build and Push
        id: build-push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nextjs-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/nextjs-app:latest

      - name: Get Docker Image Digest
        id: digest
        run: |
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository_owner }}/nextjs-app:latest)
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> $GITHUB_ENV

      - name: Checkout Infra Repository
        uses: actions/checkout@v4
        with:
          repository: kaizerpwn/infrastructure
          ref: 'main'
          token: ${{ secrets.INFRASTRUCTURE_TOKEN }}
          path: infrastructure

      - name: Update Deployment Manifest
        run: |
          # Verify the file exists
          echo "Checking file presence:"
          ls -la infrastructure/k8s/downtown-booking/

          # Update the image tag in the deployment manifest with digest
          sed -i 's|image: ghcr.io/.*/nextjs-app@.*|image: ${{ env.IMAGE_DIGEST }}|g' infrastructure/k8s/downtown-booking/deployment.yml

          # Verify the change was made
          echo "Updated deployment.yml:"
          cat infrastructure/k8s/downtown-booking/deployment.yml

          # Check for git changes
          cd infrastructure
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/downtown-booking/deployment.yml

          # Commit and push changes if there are modifications
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update image to ${{ env.IMAGE_DIGEST }}"
            git push origin main
          fi 
