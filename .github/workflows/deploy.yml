name: CI/CD Pipeline for Next.js

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nextjs-app:latest

      - name: Checkout Infra Repository
        uses: actions/checkout@v4
        with:
          repository: kaizerpwn/infrastructure
          ref: 'main'
          token: ${{ secrets.INFRASTRUCTURE_TOKEN }}
          path: infrastructure

      - name: Update Deployment Manifest
        run: |
          # Debug: Verify the file exists
          echo "Checking file presence:"
          ls -la infrastructure/k8s/downtown-booking/
          
          # Update the image tag in the deployment manifest
          sed -i 's|image: ghcr.io/.*/nextjs-app:.*|image: ghcr.io/kaizerpwn/nextjs-app:latest|g' infrastructure/k8s/downtown-booking/deployment.yml

          # Verify the change was made
          echo "Updated deployment.yml:"
          cat infrastructure/k8s/downtown-booking/deployment.yml

          # Commit and push changes if there are modifications
          cd infrastructure
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/downtown-booking/deployment.yml
          
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update image to latest version"
            git push origin main
          fi
